<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondial ECO — Interactive Architecture Explorer</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #818cf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    aside {
      width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    header p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }
    nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }
    .nav-group {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 12px 12px 6px;
    }
    button.tab-btn {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button.tab-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    button.tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      font-weight: 600;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--surface);
    }
    .top-bar h2 {
      font-size: 1rem;
      font-weight: 600;
    }
    .content-area {
      flex: 1;
      overflow: auto;
      padding: 32px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
    }
    .diagram-container {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      min-width: 800px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#090d16',
        primaryColor: '#0284c7',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#38bdf8',
        lineColor: '#38bdf8',
        secondaryColor: '#3b82f6',
        tertiaryColor: '#1e293b'
      }
    });

    const diagrams = {
      master: `graph TD
    subgraph CLIENTS["User Personas"]
        CR["Creator"]
        EN["Entrepreneur"]
        IN["Investor"]
        SP["Service Provider"]
        AD["Admin"]
    end
    subgraph EDGE["Traefik v2.11 Proxy (:443)"]
        PROXY["Reverse Proxy & TLS Termination"]
    end
    subgraph APP["Full-Stack Monolith"]
        FE["Next.js 16 (198 Routes)"]
        API["ASP.NET Core 8 API (579 Endpoints)"]
    end
    subgraph DATA["Databases & Infrastructure"]
        MONGO[("MongoDB Atlas (91 Collections)")]
        REDIS[("Redis 7 (Backplane & Cache)")]
        UPLOADS[("Upload Volume (/uploads)")]
    end
    CLIENTS --> PROXY
    PROXY --> FE
    PROXY --> API
    API --> MONGO
    API --> REDIS
    API --> UPLOADS`,
      creator: `graph TD
    CR_LOGIN["Creator Login"] --> CR_ONB["Universal Onboarding Gate"]
    CR_ONB --> CR_P2["Phase 2: Idea Discovery & AI Clarifier"]
    CR_P2 --> CR_P3["Phase 3: Business Plan & 5-Yr Forecast"]
    CR_P3 --> CR_P4["Phase 4: Valuation & Offer Pricing"]
    CR_P4 --> CR_P5["Phase 5: The Crossroads Decision"]
    CR_P5 -->|Path A| CR_BUYOUT["Full Buyout (100% Cash Exit)"]
    CR_P5 -->|Path B| CR_EQUITY["Co-Founder Equity (10-49% Split)"]
    CR_P5 -->|Path C| CR_BUILD["Build Yourself (Founder Transition)"]`,
      entrepreneur: `graph TD
    EN_LOGIN["Entrepreneur Verification"] --> EN_P2["Phase 2: Incorporation & Setup"]
    EN_P2 --> EN_P3["Phase 3: Revenue & KPI Tracker"]
    EN_P3 --> EN_P4["Phase 4: Cap Table & ESOP Engine"]
    EN_P4 --> EN_P5["Phase 5: Valuation & Funding Target"]
    EN_P5 --> EN_P6["Phase 6: Data Room & Digital NDA"]
    EN_P6 --> EN_P8["Phase 8: Smart Investor Matchmaking"]
    EN_P8 --> EN_P9["Phase 9: Deal Term Sheets & Closing"]
    EN_P9 --> EN_P10["Phase 10: Venture Scale & Reporting"]`,
      investor: `graph TD
    IN_AUTH["Investor Accredited Attestation"] --> IN_THESIS["Investment Thesis Formulation"]
    IN_THESIS --> IN_MATCH["Matchmaking Queue Ingress"]
    IN_MATCH --> IN_ROOM["Diligence Room & NDA Execution"]
    IN_ROOM --> IN_TERMS["Term Sheet & Negotiations"]
    IN_TERMS --> IN_SIGN["Bilateral Digital Signatures"]
    IN_SIGN --> IN_PORT["Active Portfolio Holding Created"]`,
      provider: `graph TD
    SP_AUTH["Provider Registration"] --> SP_CREDS["Credential & Tier Certification"]
    SP_CREDS --> SP_CAT["Service Catalog & Packages"]
    SP_CAT --> SP_LEADS["Client Briefs & Custom Proposals"]
    SP_LEADS --> SP_WORK["Workroom Milestone Delivery"]
    SP_WORK --> SP_ESCROW["Escrow Release & Bank Payout"]`,
      marketplace: `graph TD
    subgraph QUAD_MARKET["Quad-Marketplace Architecture"]
        M1["1. Creator Projects (/marketplace/projects)"]
        M2["2. Company Diligence (/discovery)"]
        M3["3. Service Catalog (/marketplace/services)"]
        M4["4. Universal Profiles (/profile/[slug])"]
    end`,
      deals: `stateDiagram-v2
    [*] --> initiated
    initiated --> negotiating
    negotiating --> term_sheet
    term_sheet --> agreement_sent
    agreement_sent --> signed
    signed --> completed
    completed --> [*]`,
      infrastructure: `graph TD
    INTERNET["Client Traffic"] --> TRAEFIK["Traefik v2.11 (:443 TLS)"]
    TRAEFIK --> NEXTJS["Next.js 16 (:3000)"]
    TRAEFIK --> APIS["ASP.NET Core Replicas (:8080)"]
    APIS --> REDIS[("Redis 7 (:6379)")]
    APIS --> MONGO[("MongoDB Atlas")]
    APIS --> VOL[("Volume uploads-data")]`
    };

    window.loadDiagram = async function(key, title) {
      document.getElementById('diagram-title').innerText = title;
      const container = document.getElementById('render-target');
      container.innerHTML = `<div class="mermaid">${diagrams[key]}</div>`;
      await mermaid.run({ nodes: container.querySelectorAll('.mermaid') });
      
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.querySelector(`[data-key="${key}"]`);
      if (activeBtn) activeBtn.classList.add('active');
    };

    window.addEventListener('DOMContentLoaded', () => {
      window.loadDiagram('master', 'Master System Architecture');
    });
  </script>
</head>
<body>
  <aside>
    <header>
      <h1>Mondial ECO</h1>
      <p>System Architecture & Design Explorer</p>
    </header>
    <nav>
      <div class="nav-group">Core System</div>
      <button class="tab-btn active" data-key="master" onclick="loadDiagram('master', 'Master System Architecture')">Master System</button>
      <button class="tab-btn" data-key="infrastructure" onclick="loadDiagram('infrastructure', 'Production Infrastructure & Topology')">Production Infrastructure</button>
      <button class="tab-btn" data-key="marketplace" onclick="loadDiagram('marketplace', 'Quad-Marketplace Architecture')">Quad Marketplace</button>

      <div class="nav-group">User Domains</div>
      <button class="tab-btn" data-key="creator" onclick="loadDiagram('creator', 'Creator Domain & Incubation')">Creator System</button>
      <button class="tab-btn" data-key="entrepreneur" onclick="loadDiagram('entrepreneur', 'Entrepreneur Venture Building')">Entrepreneur System</button>
      <button class="tab-btn" data-key="investor" onclick="loadDiagram('investor', 'Investor Pipeline & Portfolio')">Investor System</button>
      <button class="tab-btn" data-key="provider" onclick="loadDiagram('provider', 'Service Provider Workroom & Escrow')">Service Provider System</button>

      <div class="nav-group">State Machines</div>
      <button class="tab-btn" data-key="deals" onclick="loadDiagram('deals', 'Deal Execution State Machine')">Deal State Machine</button>
    </nav>
  </aside>
  <main>
    <div class="top-bar">
      <h2 id="diagram-title">Master System Architecture</h2>
      <span style="font-size: 0.8rem; color: var(--muted);">Interactive Architecture Viewer</span>
    </div>
    <div class="content-area">
      <div class="diagram-container" id="render-target"></div>
    </div>
  </main>
</body>
</html>
