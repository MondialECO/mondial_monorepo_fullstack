# gitleaks config — single source of truth used by:
#   - .pre-commit-config.yaml (developer machine)
#   - .github/workflows/secret-scan.yml (CI)
#
# Extends the upstream default ruleset; do not REPLACE it. The custom
# rules below catch re-introduction of the specific tokens that leaked
# pre-SEC-01 so the project never regresses to that state.

title = "Mondial gitleaks config"

[extend]
useDefault = true

# --- Custom rules: tripwires for historically-leaked tokens ---------------
# Any commit that re-introduces one of these specific strings fails the
# scan immediately, regardless of file extension. Values are kept here
# (intentionally) so they are detectable; they are not live secrets any
# longer once rotation completes (see SEC-01 follow-up).

[[rules]]
id      = "mondial-historical-mongo-password"
description = "Pre-SEC-01 Mongo Atlas user password (rotated; must never reappear)"
regex   = '''hr11100010'''
tags    = ["mondial", "historical-leak"]

[[rules]]
id      = "mondial-historical-jwt-key"
description = "Pre-SEC-01 weak JWT signing key string (rotated; must never reappear)"
regex   = '''SuperSecretKey1234567890'''
tags    = ["mondial", "historical-leak"]

[[rules]]
id      = "mondial-historical-smtp-password"
description = "Pre-SEC-01 SMTP password (rotated; must never reappear)"
regex   = '''Sirajul700\.23'''
tags    = ["mondial", "historical-leak"]

[[rules]]
id      = "mondial-historical-twilio-sid"
description = "Pre-SEC-01 Twilio AccountSid (rotated; must never reappear)"
regex   = '''AC53230babcb99f25e62647d5e5065c17d'''
tags    = ["mondial", "historical-leak"]

[[rules]]
id      = "mondial-historical-twilio-token"
description = "Pre-SEC-01 Twilio AuthToken (rotated; must never reappear)"
regex   = '''e6a5cb58f62689cb198535ca9d100092'''
tags    = ["mondial", "historical-leak"]

[[rules]]
id      = "mondial-atlas-cluster-id"
description = "Production Atlas cluster identifier (deployment topology leak)"
regex   = '''cluster0\.nsfffx4'''
tags    = ["mondial", "topology-leak"]

# --- Allowlist: documented false positives -------------------------------
# These paths and patterns are known-safe. Anything not listed here will
# be scanned by the default rules.

[allowlist]
description = "Mondial allowlist"

paths = [
    '''(^|/)\.gitleaks\.toml$''',        # This config holds the historical
                                         # token strings as detection rules;
                                         # scanning it would self-match.
    '''(^|/)docs/archive/''',            # Historical / archived docs
    '''(^|/)node_modules/''',
    '''(^|/)\.next/''',
    '''(^|/)bin/''',
    '''(^|/)obj/''',
    '''(^|/)\.vs/''',
    '''(^|/)\.idea/''',
    '''(^|/)package-lock\.json$''',
    '''(^|/)package\.json$''',
    '''(^|/)tsconfig\.tsbuildinfo$''',
    '''(^|/)\.git/''',
    '''(^|/)frontend/''',                # Duplicate tree slated for deletion in DEP-01
]

# Literal strings that are placeholders, fixtures, or self-documenting
# dummies (not real secrets). Update sparingly — every entry is an
# attestation that the value is safe to commit.
regexes = [
    '''<[a-z-]+>''',                                          # <placeholder> syntax
    '''USER:PASS@''',                                         # connection-string placeholder
    '''replace-with-[a-z0-9-]+''',                            # docstring-style placeholders
    '''mongodb://smoke:smoke@127\.0\.0\.1:27017/SmokeTest''', # smoke-local.ps1 dummy URI
    '''SecurePass123''',                                      # docs/archive test fixture
]

# Per-rule allowlists could be added here if a default rule produces a
# recurring false positive. None known at config-creation time.
