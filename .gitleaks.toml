# gitleaks config — single source of truth used by:
#   - .pre-commit-config.yaml (developer machine)
#   - .github/workflows/secret-scan.yml (CI)
#
# Extends the upstream default ruleset; do not REPLACE it.
#
# NOTE (SEC-01): This config MUST NOT contain raw secret values. The
# historical pre-SEC-01 tokens that once leaked have been rotated and
# purged from the entire git history. Detection of NEW secrets relies on
# the upstream default ruleset (useDefault = true), which catches the same
# credential shapes (Mongo URIs, JWT keys, Twilio SIDs/tokens, SMTP creds)
# without embedding any literal secret in this file.

title = "Mondial gitleaks config"

[extend]
useDefault = true

# --- Allowlist: documented false positives -------------------------------
# These paths and patterns are known-safe. Anything not listed here will
# be scanned by the default rules.

[allowlist]
description = "Mondial allowlist"

paths = [
    '''(^|/)docs/archive/''',            # Historical / archived docs
    '''(^|/)node_modules/''',
    '''(^|/)\.next/''',
    '''(^|/)bin/''',
    '''(^|/)obj/''',
    '''(^|/)\.vs/''',
    '''(^|/)\.idea/''',
    '''(^|/)package-lock\.json$''',
    '''(^|/)package\.json$''',
    '''(^|/)tsconfig\.tsbuildinfo$''',
    '''(^|/)\.git/''',
    '''(^|/)frontend/''',                # Duplicate tree slated for deletion in DEP-01
]

# Literal strings that are placeholders, fixtures, or self-documenting
# dummies (not real secrets). Update sparingly — every entry is an
# attestation that the value is safe to commit.
regexes = [
    '''<[a-z-]+>''',                                          # <placeholder> syntax
    '''USER:PASS@''',                                         # connection-string placeholder
    '''replace-with-[a-z0-9-]+''',                            # docstring-style placeholders
    '''mongodb://smoke:smoke@127\.0\.0\.1:27017/SmokeTest''', # smoke-local.ps1 dummy URI
    '''SecurePass123''',                                      # docs/archive test fixture
]

# Per-rule allowlists could be added here if a default rule produces a
# recurring false positive. None known at config-creation time.
