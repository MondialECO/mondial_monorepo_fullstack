name: Secret Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    # Daily full-history sweep to catch anything that slipped past PR
    # gating (e.g., via --no-verify or a force-push) and any newly-added
    # default rules from upstream gitleaks releases.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required for non-PR runs (daily sweep + direct
          # pushes); PR runs use the merge-base diff by default.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Optional org-level token unlocks SARIF upload + organization
          # rules; the action runs without it but with reduced features.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Honour the repo-level config (extends defaults + custom
          # historical-leak tripwires).
          config-path: .gitleaks.toml
