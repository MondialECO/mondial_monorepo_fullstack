    <text x="48" y="38" class="rt">/discovery/[id]/dataroom</text>
    <rect x="560" y="6" rx="9" width="186" height="22" fill="#fee2e2" stroke="#dc2626"/><text x="568" y="21" class="cls" fill="#7f1d1d">Largely Missing</text>
