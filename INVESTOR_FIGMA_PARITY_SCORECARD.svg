    <text x="48" y="38" class="rt">/pipeline</text>
    <rect x="560" y="6" rx="9" width="172" height="22" fill="#fef9c3" stroke="#ca8a04"/><text x="568" y="21" class="cls" fill="#713f12">Major / Missing</text>
    <rect x="820" y="12" width="300" height="12" rx="6" fill="#eef2f7"/><rect x="820" y="12" width="150" height="12" rx="6" fill="#ca8a04"/>
