  <line x1="40" y1="826" x2="1200" y2="826" stroke="#e2e8f0"/>
  <!-- legend -->
  <rect x="48" y="846" width="16" height="16" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="72" y="859" class="lg">Exact / Minor</text>
  <rect x="200" y="846" width="16" height="16" rx="4" fill="#fef9c3" stroke="#ca8a04"/><text x="224" y="859" class="lg">Major / partly Missing</text>
  <rect x="420" y="846" width="16" height="16" rx="4" fill="#fee2e2" stroke="#dc2626"/><text x="444" y="859" class="lg">Missing / broken live</text>
  <rect x="630" y="846" width="16" height="16" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="654" y="859" class="lg">Extra (impl-only) — keep</text>

  <text x="48" y="900" class="sub">Top P1s: Term-Sheet routes 404 (stale build) · Opportunity Score-Breakdown 0% · "Unknown founder" / "Entrepreneur · F4CC" names unresolved.</text>
  <text x="48" y="922" class="sub">Biggest parity gap: Data Room document viewer (~25%). Implementation adds Deals + Messages surfaces Figma never designed.</text>
