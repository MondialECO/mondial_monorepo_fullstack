    <rect x="820" y="12" width="300" height="12" rx="6" fill="#eef2f7"/><rect x="820" y="12" width="300" height="12" rx="6" fill="#4f46e5"/>
    <text x="1118" y="22" class="pct">keep</text>
  </g>
  <!-- 12 Messages -->
