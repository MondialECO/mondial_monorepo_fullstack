<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title{font-size:26px;font-weight:700;fill:#0f172a}
      .sub{font-size:14px;fill:#64748b}
      .h{font-size:12px;font-weight:700;fill:#475569;letter-spacing:.03em}
      .scr{font-size:14px;font-weight:600;fill:#0f172a}
      .rt{font-size:11px;font-family:Menlo,Consolas,monospace;fill:#64748b}
      .cls{font-size:11px;font-weight:700}
      .pct{font-size:13px;font-weight:700;fill:#0f172a}
      .lg{font-size:12px;fill:#334155}
      .note{font-size:11px;fill:#b91c1c}
    </style>
  </defs>
  <rect width="1240" height="940" fill="#ffffff"/>
  <text x="40" y="44" class="title">Investor UI — Figma vs Implementation Parity Scorecard</text>
  <text x="40" y="68" class="sub">2026-06-23 · live = localhost:3000 (Demo Investor) · bars = parity vs Figma (code state) · ≈57% overall code / ≈50% live-reachable</text>

  <!-- column headers -->
  <text x="48" y="104" class="h">SCREEN / ROUTE</text>
  <text x="560" y="104" class="h">CLASSIFICATION</text>
  <text x="820" y="104" class="h">PARITY vs FIGMA</text>
  <line x1="40" y1="112" x2="1200" y2="112" stroke="#e2e8f0"/>

  <!-- rows: y base -->
  <!-- helper: each row 58px tall starting at 124 -->
  <!-- Row template colors: green #16a34a/#dcfce7 amber #ca8a04/#fef9c3 red #dc2626/#fee2e2 indigo #4f46e5/#e0e7ff -->

  <!-- 1 Dashboard -->
  <g transform="translate(0,124)">
    <text x="48" y="20" class="scr">Investments Dashboard</text>
    <text x="48" y="38" class="rt">/dashboard/investor</text>
    <rect x="560" y="6" rx="9" width="150" height="22" fill="#fef9c3" stroke="#ca8a04"/><text x="568" y="21" class="cls" fill="#713f12">Major Diff</text>
    <rect x="820" y="12" width="300" height="12" rx="6" fill="#eef2f7"/><rect x="820" y="12" width="165" height="12" rx="6" fill="#ca8a04"/>
    <text x="1130" y="22" class="pct">55%</text>
  </g>
  <!-- 2 Discovery -->
  <g transform="translate(0,182)">
    <text x="48" y="20" class="scr">Discovery Feed</text>
    <text x="48" y="38" class="rt">/discovery</text>
    <rect x="560" y="6" rx="9" width="150" height="22" fill="#fef9c3" stroke="#ca8a04"/><text x="568" y="21" class="cls" fill="#713f12">Major Diff</text>
    <rect x="820" y="12" width="300" height="12" rx="6" fill="#eef2f7"/><rect x="820" y="12" width="195" height="12" rx="6" fill="#ca8a04"/>
    <text x="1130" y="22" class="pct">65%</text>
  </g>
  <!-- 3 Opp detail -->
  <g transform="translate(0,240)">
