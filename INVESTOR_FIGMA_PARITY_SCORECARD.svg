    <text x="48" y="38" class="rt">/profile/edit</text>
    <rect x="560" y="6" rx="9" width="150" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="568" y="21" class="cls" fill="#14532d">Minor Diff</text>
