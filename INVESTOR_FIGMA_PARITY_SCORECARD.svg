    <text x="48" y="38" class="rt">/term-sheet/build</text>
    <rect x="560" y="6" rx="9" width="210" height="22" fill="#fee2e2" stroke="#dc2626"/><text x="568" y="21" class="cls" fill="#7f1d1d">Matches code · 404 live</text>
    <rect x="820" y="12" width="300" height="12" rx="6" fill="#eef2f7"/><rect x="820" y="12" width="270" height="12" rx="6" fill="#dc2626"/>
    <text x="1125" y="22" class="pct">90% / 0%</text>
  </g>
  <!-- 7 Thesis -->
  <g transform="translate(0,472)">
    <text x="48" y="20" class="scr">Investment Thesis</text>
    <text x="48" y="38" class="rt">/thesis</text>
    <rect x="560" y="6" rx="9" width="150" height="22" fill="#fef9c3" stroke="#ca8a04"/><text x="568" y="21" class="cls" fill="#713f12">Major Diff</text>
    <rect x="820" y="12" width="300" height="12" rx="6" fill="#eef2f7"/><rect x="820" y="12" width="210" height="12" rx="6" fill="#ca8a04"/>
