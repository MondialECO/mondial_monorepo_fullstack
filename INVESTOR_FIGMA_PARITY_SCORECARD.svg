    <text x="48" y="20" class="scr">Messages</text>
    <text x="48" y="38" class="rt">/messages</text>
    <rect x="560" y="6" rx="9" width="210" height="22" fill="#e0e7ff" stroke="#4f46e5"/><text x="568" y="21" class="cls" fill="#312e81">Extra · not in Figma</text>
