  state = { active:'ai', rightOpen:true, inputs:{}, chState:{}, extraMsgs:{}, toast:null };

  // ---- navigation ----
  sel(id){ this.setState({ active:id }); setTimeout(()=>this.scrollStream(),80); }
  toggleRight(){ this.setState(s=>({ rightOpen:!s.rightOpen })); }
  scrollStream(){ const el=document.querySelector('[data-stream]'); if(el) el.scrollTop=el.scrollHeight; }

  // ---- toast ----
  showToast(msg,color){
    if(this._tt) clearTimeout(this._tt);
    this.setState({ toast:{ msg, color:color||C.green } });
    this._tt=setTimeout(()=>this.setState({toast:null}),3000);
  }

  // ---- per-channel state ----
  ch(id){ return this.state.chState[id]||{}; }
  setCh(id,patch){ this.setState(s=>({ chState:{...s.chState,[id]:{...(s.chState[id]||{}),...patch}} })); }

  // ---- input ----
  getInput(id){ return this.state.inputs[id]||''; }
  setInput(id,val){ this.setState(s=>({ inputs:{...s.inputs,[id]:val} })); }

  // ---- messages ----
  addMsgs(id,...msgs){
    this.setState(s=>({ extraMsgs:{...s.extraMsgs,[id]:[...(s.extraMsgs[id]||[]),...msgs]} }),()=>this.scrollStream());
  }
  sendTyped(){

    const naGreen = r.greenNa;
    const sections = r.sections.map((sec,si)=> h('div', { key:si, style:{ marginBottom:20 } }, [
      h('div', { key:'l', style:{ fontFamily:FM, fontSize:10, textTransform:'uppercase', letterSpacing:'1px', color:C.faint, marginBottom:8 } }, sec.label),
      ...sec.rows.map((row,ri)=> h('div', { key:ri, style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'6px 0', borderTop: ri?`1px solid ${C.line}`:'none', gap:10 } }, [
        h('span', { key:'k', style:{ fontFamily:FB, fontSize:12.5, color:C.mut } }, row[0]),
        row[2]
          ? h('span', { key:'v' }, [this.statusPill(row[1], row[2])])
          : h('span', { key:'v', style:{ fontFamily:FB, fontWeight:600, fontSize:12.5, color:C.tx, textAlign:'right' } }, row[1]),
      ])),
    ]));

    const smart = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 } }, r.smart.map((s,i)=> h('button', { key:i, onClick:()=>this.handleAction(s), style:{ fontFamily:FB, fontWeight:600, fontSize:12, color:C.tx, background:'#fff', border:`1px solid ${C.line}`, borderRadius:10, padding:'10px 8px', cursor:'pointer', lineHeight:1.25 } }, s)));

    const ctaVariant = r.na.cc || 'blue';
    return h('div', { style:{ width:320, minWidth:320, height:'100%', borderLeft:`1px solid ${C.line}`, overflowY:'auto', padding:18, background:'#fff' } }, [
      // readiness
      h('div', { key:'rd', style:{ marginBottom:18 } }, [
        h('div', { key:'l', style:{ fontFamily:FM, fontSize:10, textTransform:'uppercase', letterSpacing:'1px', color:C.faint, marginBottom:8 } }, 'READINESS'),
        h('div', { key:'n', style:{ display:'flex', alignItems:'baseline', gap:8 } }, [
          h('span', { key:'p', style:{ fontFamily:FD, fontWeight:800, fontSize:30, color: pct===100?C.green:C.tx } }, pct+'%'),
          h('span', { key:'t', style:{ fontFamily:FB, fontSize:12, color:C.mut } }, 'project ready'),
        ]),
        h('div', { key:'bar', style:{ height:7, background:C.s2, borderRadius:999, marginTop:9, overflow:'hidden' } }, [
          h('div', { key:'f', style:{ height:'100%', width:pct+'%', background: pct===100?C.green:C.blue, borderRadius:999 } }),
        ]),
      ]),
      // next action card
      h('div', { key:'na', style:{ border:`1px solid ${C.line}`, borderRadius:14, overflow:'hidden', marginBottom:20 } }, [
        h('div', { key:'hb', style:{ background: naGreen?C.green:C.blue, color:'#fff', fontFamily:FM, fontSize:10, fontWeight:600, letterSpacing:'.6px', padding:'7px 13px' } }, r.na.header || 'NEXT ACTION'),
        h('div', { key:'bd', style:{ padding:13 } }, [
          h('div', { key:'t', style:{ fontFamily:FB, fontSize:13, color:C.tx, lineHeight:1.5, marginBottom:11 } }, r.na.body),
          h('button', { key:'c', onClick:()=>this.handleAction(r.na.cta), style:{ width:'100%', padding:'11px', border:'none', borderRadius:12, cursor:'pointer', fontFamily:FB, fontWeight:700, fontSize:13,
            background: ctaVariant==='green'?C.green: ctaVariant==='amber'?C.amber: C.blue, color:'#fff' } }, r.na.cta),
        ]),
      ]),
      ...sections,
      h('div', { key:'sm', style:{ marginBottom:4 } }, [
        h('div', { key:'l', style:{ fontFamily:FM, fontSize:10, textTransform:'uppercase', letterSpacing:'1px', color:C.faint, marginBottom:8 } }, 'SMART ACTIONS'),
        smart,
      ]),
    ]);
  }

  renderVals(){
    const h = React.createElement;
    const d = D[this.state.active] || D.ai;
    const t = this.state.toast;
    const toast = t ? h('div', { style:{
      position:'fixed', bottom:28, left:'50%', transform:'translateX(-50%)',
      background: t.color, color:'#fff', fontFamily:FB, fontWeight:600, fontSize:13.5,
      padding:'12px 22px', borderRadius:12, zIndex:9999,
      boxShadow:'0 8px 24px rgba(0,0,0,.18)', whiteSpace:'nowrap',
      animation:'none', pointerEvents:'none'
    }}, t.msg) : null;
    return {
      toast,
      leftRail: this.buildLeftRail(),
      centerHeader: this.buildHeader(d),
      messageStream: this.buildStream(d),
      composer: this.buildComposer(d),
      rightPanel: this.state.rightOpen ? this.buildRight(d) : null,
    };
  }
}
</script>
</body>
</html>
